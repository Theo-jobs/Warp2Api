version: "3.8"

services:
  warp2api:
    build: .
    container_name: warp2api
    restart: unless-stopped
    ports:
      - "28889:28889"   # OpenAI 兼容 API（对外暴露这个即可）
      # - "28888:28888" # Protobuf 桥接（内部使用，一般不需要暴露）
      # - "28887:28887" # Rust TLS 代理（内部使用，一般不需要暴露）
    environment:
      # ===== 必填 =====
      - WARP_REFRESH_TOKEN=${WARP_REFRESH_TOKEN}  # Warp 刷新令牌
      - API_TOKEN=${API_TOKEN:-0000}               # 对外 API 认证令牌

      # ===== 可选 =====
      # - WARP_JWT=                    # JWT（自动获取，一般不需要手动设置）
      # - W2A_VERBOSE=false            # 详细日志
      # - HTTP_PROXY=                  # 代理设置
      # - HTTPS_PROXY=
      - NO_PROXY=127.0.0.1,localhost
    volumes:
      - warp2api-logs:/app/logs        # 持久化日志
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:28889/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  warp2api-logs:
